<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
<title id="title">Pyramid Architect — 思维架构师</title><desc id="desc">让思想，形成力量。基于金字塔原理的 Codex 技能。</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fbfcfe"/><stop offset="1" stop-color="#f0f1fa"/></linearGradient>
<linearGradient id="left" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".96"/><stop offset=".55" stop-color="#a8c9f5" stop-opacity=".38"/><stop offset="1" stop-color="#f8f7ff" stop-opacity=".9"/></linearGradient>
<linearGradient id="right" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset=".55" stop-color="#aeaceb" stop-opacity=".42"/><stop offset="1" stop-color="#e4edff"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#b9c5f8" stop-opacity=".5"/><stop offset="1" stop-color="#c4d7fa" stop-opacity="0"/></radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1600" height="640" rx="28" fill="url(#bg)"/>
<ellipse cx="1260" cy="340" rx="340" ry="300" fill="url(#halo)"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif">
<text x="96" y="111" fill="#62697b" font-size="18" letter-spacing="6">PYRAMID ARCHITECT</text>
<text x="91" y="239" fill="#15171d" font-size="68" font-weight="650">让思想，</text>
<text x="91" y="329" fill="#15171d" font-size="68" font-weight="650">形成力量。</text>
<text x="96" y="399" fill="#555d6e" font-size="26">思维架构师</text>
<text x="96" y="446" fill="#777e8b" font-size="21">结构化思考 · 专业写作 · 逻辑审阅</text>
<rect x="96" y="508" width="178" height="39" rx="19.5" fill="white" stroke="#dce0eb"/>
<text x="185" y="534" fill="#606a80" font-size="16" text-anchor="middle" letter-spacing="1">THINK · WRITE</text>
</g>
<ellipse cx="1237" cy="519" rx="194" ry="25" fill="#abb4db" opacity=".25" filter="url(#blur)"/>
<g stroke="#a4b4dc" stroke-width="1.5" stroke-linejoin="round">
<path d="M1240 132 L1035 468 L1237 525Z" fill="url(#left)"/>
<path d="M1240 132 L1450 468 L1237 525Z" fill="url(#right)"/>
<path d="M1035 468 L1240 409 L1450 468 L1237 525Z" fill="#e7edff" fill-opacity=".65"/>
<path d="M1240 132 L1240 409 L1035 468 M1240 409 L1450 468 M1240 132 L1237 525" fill="none" stroke="#fff" stroke-opacity=".85"/>
<path d="M1240 132 L1110 451 L1237 525 L1374 451Z" fill="none" stroke="#b2c5f0" stroke-opacity=".6"/>
</g>
</svg>